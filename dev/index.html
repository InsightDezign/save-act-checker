<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>TimeClock — Phase 1 (dev)</title>
    <style>
      body {
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0; padding: 16px;
        background: #1e1e1e; color: #eaeaea;
      }
      h1 { font-size: 16px; margin: 0 0 8px; }
      h2 { font-size: 13px; margin: 16px 0 4px; color: #aaa; text-transform: uppercase; letter-spacing: .04em; }
      code, pre {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
      }
      pre {
        background: #111; border: 1px solid #333; border-radius: 4px;
        padding: 8px; overflow: auto; max-height: 140px;
      }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
      button {
        background: #2d6cdf; color: white; border: 0; border-radius: 4px;
        padding: 4px 10px; font-size: 12px; cursor: pointer;
      }
      button:hover { background: #3b7df0; }
      button.muted { background: #444; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #333; font-size: 11px; }
      .pill.idle    { background: #555; }
      .pill.running { background: #1f7a3a; }
      .pill.paused  { background: #856a1c; }
    </style>
  </head>
  <body>
    <h1>TimeClock — Phase 1 (core)</h1>
    <p style="color:#aaa;font-size:12px;">
      No UI yet — open DevTools and poke at <code>window.timeclock</code>.
    </p>

    <h2>Timer</h2>
    <div class="row">
      State: <span id="state" class="pill idle">IDLE</span>
      <span id="elapsed" style="font-family: ui-monospace, monospace;">0s</span>
    </div>

    <h2>Quick smoke test</h2>
    <div class="row">
      <button id="seed">Seed: client + task</button>
      <button id="start" class="muted">Start (last task)</button>
      <button id="pause" class="muted">Pause</button>
      <button id="resume" class="muted">Resume</button>
      <button id="stop" class="muted">Stop</button>
    </div>

    <h2>Output</h2>
    <pre id="out">(ready)</pre>

    <script src="./dev.js"></script>
  </body>
</html>
