appId: com.insightdezign.timeclock
productName: TimeClock
directories:
  output: dist
files:
  - main/**/*
  - preload/**/*
  - renderer/**/*
  - dev/**/*
  - assets/**/*
  - package.json
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  perMachine: false
