<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>TimeClock</title>
    <link rel="stylesheet" href="floating.css" />
  </head>
  <body>
    <button id="btn" class="btn idle" type="button" aria-label="TimeClock">
      <svg id="icon-idle" class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2" fill="none" />
        <path d="M12 7v5l3 2" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" />
      </svg>
      <svg id="icon-running" class="icon hidden" viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="8,6 18,12 8,18" fill="white" />
      </svg>
      <svg id="icon-paused" class="icon hidden" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7" y="6" width="3.5" height="12" fill="white" />
        <rect x="13.5" y="6" width="3.5" height="12" fill="white" />
      </svg>
    </button>
    <script src="floating.js"></script>
  </body>
</html>
